# Thin caller for the fleet CI/CD standard. The pipeline lives beside this
# file (fleet-ci.yml) and every app in the fleet calls the same one.
# See GAME_INTEGRATION.md §13a.
#
# This repo's tier used to be ~20 enumerated steps here. It lives in
# tools/run-ci.mjs now, so `npm test` is the gate — the same contract every
# game meets — and a laptop can run exactly what CI runs.
name: CI & Deploy Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Per-ref, so a PR run never cancels main's deploy.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fleet:
    uses: ./.github/workflows/fleet-ci.yml
    with:
      browsers: chromium chrome
      # The launcher opted out of auto-bumping while sw.js carried a
      # hand-numbered CACHE_NAME (bumping package.json would not have moved
      # it). sw.js now derives its cache name from APP_VERSION, which this
      # step rewrites — so the launcher's cache identity finally advances on
      # every deploy, the same as every game's.
      version_bump: true
