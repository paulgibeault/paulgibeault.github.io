# The fleet CI/CD standard — one pipeline, every arcade app.
#
# Each app repo carries a thin caller (see GAME_INTEGRATION.md §CI) that
# `uses:` this workflow @main. Change the pipeline here and the whole fleet
# follows on its next run; nothing is copy-pasted into app repos, so nothing
# drifts.
#
# Shape: three jobs.
#
#   test    the gate. Contract gates, the app's own suite, and (opt-in) the
#           launcher acceptance checklist. Nothing deploys without it.
#   smoke   advisory. Does the artifact actually draw? Runs in PARALLEL with
#           `test` and gates nothing — see the job for why that matters.
#   deploy  needs `test` only. Pull requests never reach it; neither do
#           scheduled runs, which exist to exercise the pipeline, not to
#           publish an identical site with a new version number.
#
# Apps opt into extras through inputs instead of forking the pipeline.
#
# Logic lives in launcher-owned scripts under tools/, not in this file: a
# laptop can run exactly what CI runs, and a unit suite can assert what it
# does. What is left here is orchestration.
#
# ── Which revision the scripts come from ────────────────────────────────────
#
# An app repo does not carry the scripts this pipeline runs. They are checked
# out from the launcher as `.launcher-gates`, at `inputs.toolchain_ref` —
# empty by default, which means the launcher's default branch.
#
# That default is correct for every real caller, because a pipeline change and
# the scripts it needs land on main in the SAME merge; the YAML a caller reads
# from `@main` and the tools it fetches from `main` are already one revision.
#
# It is not self-correcting in two cases, so they are worth knowing:
#
#   · A caller pinning `fleet-ci.yml@some-tag` gets that tag's YAML with the
#     default branch's tools. Pinning half-works. Pass `toolchain_ref` too.
#   · A pipeline change that needs a NEW script cannot be exercised from
#     another repo before it merges — the canary reaches for a file that is
#     on the branch and not yet on main. That is not hypothetical: it is how
#     the canary for this rework failed, which is what `toolchain_ref` is for.
#
# The obvious fix — pin to the reusable workflow's own commit — is not
# available. MEASURED, not assumed, on runner 2.336.0: inside a called
# workflow `github.job_workflow_sha` and `github.job_workflow_ref` are both
# EMPTY, and `github.workflow_sha`/`github.workflow_ref` describe the CALLER
# (`…/hecknsic/.github/workflows/pages.yml@refs/pull/61/merge`), not this
# file. No context variable exposes this workflow's own revision, so an
# explicit input is the honest mechanism rather than a clever one.

name: Fleet CI & Deploy

on:
  workflow_call:
    inputs:
      launcher:
        description: >-
          Check out the arcade launcher inside the workspace (exported as
          ARCADE_LAUNCHER) for suites that stage the launcher-and-game
          origin, and run `npm run acceptance` (the launcher's integration
          checklist) after the app's own tests.
        type: boolean
        default: false
      browsers:
        description: >-
          Playwright browsers the test tier needs, space-separated
          (e.g. "chromium webkit"). Empty skips the browser install.
        type: string
        default: ""
      version_bump:
        description: >-
          Auto-bump the patch version on each deploy — package.json,
          manifest.json start_url cache-buster, the declared version badge in
          index.html, and sw.js's APP_VERSION where the app declares it —
          and push the commit back. The caller must grant `contents: write`.
          See tools/bump-version.mjs.
        type: boolean
        default: false
      toolchain_ref:
        description: >-
          Ref of the launcher to take this pipeline's own scripts from (the
          `.launcher-gates` checkout). Empty — the default — means the
          launcher's default branch, which is right for every real caller.
          Set it ONLY to exercise an unmerged pipeline change from another
          repo, and remove it again afterwards. See "Which revision the
          scripts come from" above.
        type: string
        default: ""

jobs:
  # ===========================================================================
  # test — the gate
  # ===========================================================================
  test:
    runs-on: ubuntu-latest
    env:
      ARCADE_LAUNCHER: ${{ inputs.launcher && format('{0}/.launcher', github.workspace) || '' }}
    steps:
      - uses: actions/checkout@v5

      - name: Check out the launcher beside the app
        if: ${{ inputs.launcher }}
        uses: actions/checkout@v5
        with:
          repository: paulgibeault/paulgibeault.github.io
          # Deliberately NOT pinned to job_workflow_sha, unlike .launcher-gates
          # below. This checkout is the launcher the game is tested AGAINST —
          # it stands in for the deployed origin, so it should track what is
          # live. The gates checkout is the pipeline's own toolchain, which
          # must match the pipeline. Same repository, two different questions.
          path: .launcher

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          # Only three repos in the fleet keep a lockfile; setup-node's cache
          # HARD-FAILS when it cannot find one, so it is asked for only when
          # there is something to key on. The repos without a lockfile are the
          # zero-dependency ones, which have nothing to cache anyway.
          cache: ${{ hashFiles('package-lock.json') != '' && 'npm' || '' }}

      # ---- the fleet's §5/§6d power-saver contract -------------------------
      #
      # Runs for EVERY caller, unconditionally. It deliberately does not ride
      # the `launcher:` input — only two callers set that, and this has to hold
      # everywhere or it is just three repos' local copies again under a new
      # name. Before the installs, because it needs nothing installed: the
      # script is zero-dep pure Node, and a contract violation should fail in
      # seconds rather than after a Playwright download.
      #
      # The checkout is skipped when the workspace already IS the launcher —
      # this repo calls the pipeline too, and then the PR's own copy of the
      # gate is the one that runs, which is what makes a change to the gate
      # testable in the PR that makes it.
      #
      # `.launcher-gates` is untracked in the app's checkout, so the gate's
      # `git ls-files` enumeration of the target never sees it.
      - name: Check out the fleet toolchain
        if: ${{ hashFiles('tools/contract-gates.mjs') == '' }}
        uses: actions/checkout@v5
        with:
          repository: paulgibeault/paulgibeault.github.io
          # Empty (the default) means the launcher's default branch, which is
          # what every real caller wants. See "Which revision the scripts come
          # from" in the header.
          ref: ${{ inputs.toolchain_ref }}
          path: .launcher-gates

      - name: Fleet contract gates (GAME_INTEGRATION §5/§6d)
        run: |
          GATES=tools/contract-gates.mjs
          [ -f "$GATES" ] || GATES=.launcher-gates/tools/contract-gates.mjs
          node "$GATES" .

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci
          elif [ -f package.json ]; then npm install
          fi
          if [ -n "$ARCADE_LAUNCHER" ]; then (cd "$ARCADE_LAUNCHER" && npm ci); fi

      # Browser downloads were the single largest step in the fleet — 46s of a
      # 3-minute run, every run, because nothing was cached. (A comment here
      # used to claim they were. They were not.) The key carries the resolved
      # Playwright versions, so a dependency bump invalidates it and anything
      # else reuses it.
      - name: Cache Playwright browsers
        if: ${{ inputs.browsers != '' }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          # Lockfiles only. package.json carries the version this pipeline
          # rewrites on every deploy, so keying on it would miss the cache
          # every single run — the exact opposite of the point.
          key: playwright-${{ runner.os }}-${{ inputs.browsers }}-${{ hashFiles('package-lock.json', '.launcher/package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-${{ inputs.browsers }}-

      - name: Install Playwright browsers
        if: ${{ inputs.browsers != '' }}
        # Each checkout pins its own Playwright; installing for both sides of
        # a launcher-staged run only costs a download on a version mismatch.
        # With a warm cache this is a no-op for the browsers themselves and
        # only re-runs the OS dependency check.
        run: |
          npx playwright install --with-deps ${{ inputs.browsers }}
          if [ -n "$ARCADE_LAUNCHER" ]; then
            (cd "$ARCADE_LAUNCHER" && npx playwright install --with-deps chromium)
          fi

      - name: Test
        # The gate. An app with a test script runs it; an app without one
        # gets the floor gate — every tracked JS file must at least parse.
        # Nothing deploys untested, and adding a real suite later needs no
        # workflow change.
        run: |
          if [ -f package.json ] && \
             [ "$(node -p 'Boolean(require("./package.json").scripts?.test)')" = "true" ]; then
            npm test
          else
            echo "No test script — syntax-checking every tracked JS file"
            git ls-files '*.js' '*.mjs' | while read -r f; do
              echo "checking $f"
              node --check "$f"
            done
          fi

      - name: Arcade integration acceptance
        if: ${{ inputs.launcher }}
        run: npm run acceptance

  # ===========================================================================
  # smoke — does the thing this repo is about to deploy actually draw?
  # ===========================================================================
  #
  # Every gate in `test` can be green while the product is a black rectangle:
  # the unit tiers cover pure logic and never touch a canvas, verify-artifact
  # proves every referenced file is published (a blank game publishes
  # perfectly), and `node --check` proves the JS parses.
  #
  # ITS OWN JOB, IN PARALLEL, ON PURPOSE. This used to be the last step of
  # `test`, which meant an ADVISORY check sat in the deploy's critical path:
  # `deploy` needs the whole `test` job, so a warn-only step that cannot fail
  # anything still delayed every publish by however long it took. For the seven
  # callers with no browser of their own that was about to mean an npm ci plus
  # a chromium download — roughly two minutes added to deploys that currently
  # finish in thirty-four seconds. Parallel, it costs the deploy nothing and
  # still reports on every run.
  #
  # WARN ONLY, for now. The contract gates went enforcing on day one because
  # they are static scans of a fleet verified clean; a browser check on shared
  # runners has to earn that. Flipping it is a one-line change — drop `--warn`
  # and `continue-on-error` — and should follow a track record, not a hunch.
  # `continue-on-error` covers the infrastructure half: --warn already makes a
  # blank frame exit 0, so what it catches is a crashed browser or a failed
  # install, which must not turn the fleet red in warn mode.
  smoke:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: ${{ hashFiles('package-lock.json') != '' && 'npm' || '' }}

      - name: Check out the fleet toolchain
        if: ${{ hashFiles('tools/render-smoke.mjs') == '' }}
        uses: actions/checkout@v5
        with:
          repository: paulgibeault/paulgibeault.github.io
          # Empty (the default) means the launcher's default branch, which is
          # what every real caller wants. See "Which revision the scripts come
          # from" in the header.
          ref: ${{ inputs.toolchain_ref }}
          path: .launcher-gates

      # Whichever checkout owns render-smoke.mjs is the one that needs a
      # browser: this repo when it smokes itself, the gates checkout otherwise.
      - name: Resolve the smoke toolchain
        run: |
          if [ -f tools/render-smoke.mjs ]; then
            echo "SMOKE_ROOT=." >> "$GITHUB_ENV"
          else
            echo "SMOKE_ROOT=.launcher-gates" >> "$GITHUB_ENV"
          fi

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-smoke-${{ hashFiles('package-lock.json', '.launcher-gates/package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-smoke-

      - name: Install the smoke toolchain
        run: |
          (cd "$SMOKE_ROOT" && npm ci --silent)
          (cd "$SMOKE_ROOT" && npx playwright install --with-deps chromium)

      # Staged the DEPLOY's way, by the same module the deploy job calls.
      # These were two mirrored shell blocks kept in step by a comment on each,
      # which is how two repos once shipped a placeholder sw.js that every test
      # was happy with: the suite staged one way and the deploy another.
      - name: Stage the artifact
        run: |
          TOOLS=tools
          [ -f tools/stage-dispatch.mjs ] || TOOLS=.launcher-gates/tools
          node "$TOOLS/stage-dispatch.mjs" dist --optional

      - name: Render smoke (warn only)
        run: |
          if [ ! -d dist ]; then
            echo "nothing was staged — no artifact to smoke"; exit 0
          fi
          SMOKE="$SMOKE_ROOT/tools/render-smoke.mjs"
          # Optional per-app declaration, for an app whose cold load cannot
          # reach a drawn frame on its own — an intro tap-gate, a first-run
          # modal. No app in the fleet needs one today.
          HINTS=""
          if [ -f tools/smoke.mjs ]; then HINTS="--hints tools/smoke.mjs"; fi
          node "$SMOKE" dist --sdk "$SMOKE_ROOT" --label "${GITHUB_REPOSITORY##*/}" --warn $HINTS

  # ===========================================================================
  # deploy
  # ===========================================================================
  #
  # `needs: test` only. The smoke job is advisory and must never hold a publish
  # back — see the note on that job.
  #
  # Scheduled runs are excluded alongside pull requests. A caller adds a
  # `schedule:` trigger to exercise the pipeline against evergreen refs
  # (fleet-ci@main, checkout@v5, deploy-pages@v4) on a cadence instead of
  # discovering the breakage mid-feature. That canary must not publish: with
  # version_bump on it would otherwise republish an identical site under a new
  # version every week, forcing every returning player's service worker to
  # reinstall for nothing.
  deploy:
    needs: test
    if: ${{ github.event_name != 'pull_request' && github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          # The bump commit rebases onto whatever landed while the gate ran,
          # which needs real history. These repos are 27–183 commits; the
          # difference is not measurable.
          #
          # Quoted on purpose. GitHub's `a && b || c` follows JS truthiness, so
          # an unquoted `version_bump && 0 || 1` yields 1 in BOTH branches —
          # 0 is falsy and falls through to the `|| 1`. The strings are truthy.
          fetch-depth: ${{ inputs.version_bump && '0' || '1' }}

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Check out the fleet toolchain
        if: ${{ hashFiles('tools/stage-dispatch.mjs') == '' }}
        uses: actions/checkout@v5
        with:
          repository: paulgibeault/paulgibeault.github.io
          # Empty (the default) means the launcher's default branch, which is
          # what every real caller wants. See "Which revision the scripts come
          # from" in the header.
          ref: ${{ inputs.toolchain_ref }}
          path: .launcher-gates

      - name: Resolve the fleet toolchain
        run: |
          if [ -f tools/stage-dispatch.mjs ]; then
            echo "FLEET_TOOLS=tools" >> "$GITHUB_ENV"
          else
            echo "FLEET_TOOLS=.launcher-gates/tools" >> "$GITHUB_ENV"
          fi

      # Before staging, so the artifact — and therefore the deployed sw.js —
      # carries the new version. tools/bump-version.mjs owns the rewrite rules
      # and the push-with-rebase; it is unit-tested, which the fifty lines of
      # inline sed it replaced never were.
      - name: Bump patch version
        if: ${{ inputs.version_bump }}
        run: node "$FLEET_TOOLS/bump-version.mjs"

      - name: Stage deploy artifact (dist)
        # The same module the smoke job calls, so what gets smoked and what
        # gets published are staged by one implementation.
        run: node "$FLEET_TOOLS/stage-dispatch.mjs" dist

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4

      # ---- did any of that reach the public URL? ---------------------------
      #
      # deploy-pages succeeding proves GitHub ACCEPTED an artifact, not that a
      # browser loading the site gets those bytes. That gap is hecknsic#50/#52:
      # a green deploy of a real fix that no returning player ever executed,
      # because sw.js's cache identity had not moved. Enforcing, unlike the
      # smoke job — it is a plain HTTP GET with retries for CDN propagation,
      # and it runs after the publish, so failing blocks nothing. It only turns
      # a silent bad deploy into a red build.
      - name: Verify the origin serves this deploy
        run: node "$FLEET_TOOLS/verify-origin.mjs" "${{ steps.deployment.outputs.page_url }}" --artifact dist
