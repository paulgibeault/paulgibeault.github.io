# The fleet CI/CD standard — one pipeline, every arcade app.
#
# Each app repo carries a thin caller (see GAME_INTEGRATION.md §CI) that
# `uses:` this workflow @main. Change the pipeline here and the whole fleet
# follows on its next run; nothing is copy-pasted into app repos, so nothing
# drifts.
#
# Shape: a `test` job gates a `deploy` job. Pull requests run the gate and
# never deploy; pushes to main deploy only after the gate passes. Apps opt
# into extras through inputs instead of forking the pipeline.

name: Fleet CI & Deploy

on:
  workflow_call:
    inputs:
      launcher:
        description: >-
          Check out the arcade launcher inside the workspace (exported as
          ARCADE_LAUNCHER) for suites that stage the launcher-and-game
          origin, and run `npm run acceptance` (the launcher's integration
          checklist) after the app's own tests.
        type: boolean
        default: false
      browsers:
        description: >-
          Playwright browsers the test tier needs, space-separated
          (e.g. "chromium webkit"). Empty skips the browser install.
        type: string
        default: ""
      version_bump:
        description: >-
          Auto-bump the patch version on each deploy — package.json,
          manifest.json start_url cache-buster, the version badge in
          index.html, and sw.js's APP_VERSION where the app declares it —
          and push the commit back. The caller must grant `contents: write`.
        type: boolean
        default: false

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      ARCADE_LAUNCHER: ${{ inputs.launcher && format('{0}/.launcher', github.workspace) || '' }}
    steps:
      - uses: actions/checkout@v5

      - name: Check out the launcher beside the app
        if: ${{ inputs.launcher }}
        uses: actions/checkout@v5
        with:
          repository: paulgibeault/paulgibeault.github.io
          path: .launcher

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      # ---- the fleet's §5/§6d power-saver contract -------------------------
      #
      # Runs for EVERY caller, unconditionally. It deliberately does not ride
      # the `launcher:` input — only two callers set that, and this has to hold
      # everywhere or it is just three repos' local copies again under a new
      # name. Before the installs, because it needs nothing installed: the
      # script is zero-dep pure Node, and a contract violation should fail in
      # seconds rather than after a Playwright download.
      #
      # The checkout is skipped when the workspace already IS the launcher —
      # this repo calls the pipeline too, and then the PR's own copy of the
      # gate is the one that runs, which is what makes a change to the gate
      # testable in the PR that makes it.
      #
      # `.launcher-gates` is untracked in the app's checkout, so the gate's
      # `git ls-files` enumeration of the target never sees it.
      - name: Check out the fleet contract gates
        if: ${{ hashFiles('tools/contract-gates.mjs') == '' }}
        uses: actions/checkout@v5
        with:
          repository: paulgibeault/paulgibeault.github.io
          path: .launcher-gates

      - name: Fleet contract gates (GAME_INTEGRATION §5/§6d)
        run: |
          GATES=tools/contract-gates.mjs
          [ -f "$GATES" ] || GATES=.launcher-gates/tools/contract-gates.mjs
          node "$GATES" .

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci
          elif [ -f package.json ]; then npm install
          fi
          if [ -n "$ARCADE_LAUNCHER" ]; then (cd "$ARCADE_LAUNCHER" && npm ci); fi

      - name: Install Playwright browsers
        if: ${{ inputs.browsers != '' }}
        # Each checkout pins its own Playwright; installing for both sides of
        # a launcher-staged run only costs a download on a version mismatch.
        run: |
          npx playwright install --with-deps ${{ inputs.browsers }}
          if [ -n "$ARCADE_LAUNCHER" ]; then
            (cd "$ARCADE_LAUNCHER" && npx playwright install --with-deps chromium)
          fi

      - name: Test
        # The gate. An app with a test script runs it; an app without one
        # gets the floor gate — every tracked JS file must at least parse.
        # Nothing deploys untested, and adding a real suite later needs no
        # workflow change.
        run: |
          if [ -f package.json ] && \
             [ "$(node -p 'Boolean(require("./package.json").scripts?.test)')" = "true" ]; then
            npm test
          else
            echo "No test script — syntax-checking every tracked JS file"
            git ls-files '*.js' '*.mjs' | while read -r f; do
              echo "checking $f"
              node --check "$f"
            done
          fi

      - name: Arcade integration acceptance
        if: ${{ inputs.launcher }}
        run: npm run acceptance

      # ---- does the thing this repo is about to deploy actually draw? ------
      #
      # Every other gate here can be green while the product is a black
      # rectangle: the unit tiers cover pure logic and never touch a canvas,
      # verify-artifact.mjs proves every referenced file is published (a blank
      # game publishes perfectly), and `node --check` proves the JS parses.
      #
      # WARN ONLY, for now. The contract gates above went enforcing on day one
      # because they are static scans of a fleet verified clean; a browser
      # check on shared runners has to earn that. It annotates and does not
      # fail. Flipping it is a one-line change in this file — drop `--warn` and
      # `continue-on-error` — and should follow a track record, not a hunch.
      # `continue-on-error` covers the infrastructure half: --warn already
      # makes a blank frame exit 0, so what this catches is a crashed browser
      # or a failed install, which must not turn the fleet red in warn mode.
      #
      # Runs last: it is advisory, so it must never delay the real gate's
      # feedback.
      - name: Render smoke (warn only)
        continue-on-error: true
        run: |
          set -e
          if [ -f tools/render-smoke.mjs ]; then
            SMOKE=tools/render-smoke.mjs; SDK=.
          else
            SMOKE=.launcher-gates/tools/render-smoke.mjs; SDK=.launcher-gates
            # The gate checkout above carries no node_modules, and most callers
            # install no browsers of their own (the `browsers` input is empty
            # for all but two). Both are cached between runs.
            (cd .launcher-gates && npm ci --silent)
            (cd .launcher-gates && npx playwright install --with-deps chromium)
          fi
          # Stage the artifact the DEPLOY's own way, not the test's. This block
          # mirrors "Stage deploy artifact (dist)" in the deploy job below —
          # change one, change the other. Validating a differently-staged copy
          # is how two repos once shipped a placeholder sw.js that every test
          # was happy with: the suite staged one way and the deploy another.
          if [ -f package.json ] && \
             [ "$(node -p 'Boolean(require("./package.json").scripts?.build)')" = "true" ]; then
            npm run build
          elif [ -f tools/stage.mjs ]; then
            node tools/stage.mjs dist
          else
            echo "No build script and no tools/stage.mjs — nothing staged to smoke"
            exit 0
          fi
          # Optional per-app declaration, for an app whose cold load cannot
          # reach a drawn frame on its own — an intro tap-gate, a first-run
          # modal. No app in the fleet needs one today.
          HINTS=""
          if [ -f tools/smoke.mjs ]; then HINTS="--hints tools/smoke.mjs"; fi
          node "$SMOKE" dist --sdk "$SDK" --label "${GITHUB_REPOSITORY##*/}" --warn $HINTS

  deploy:
    needs: test
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Bump patch version
        if: ${{ inputs.version_bump }}
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          NEW=$(node -e "
            const [maj,min,pat] = '$CURRENT'.split('.').map(Number);
            console.log(maj+'.'+min+'.'+(pat+1));
          ")
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('package.json'));
            p.version = '$NEW';
            fs.writeFileSync('package.json', JSON.stringify(p, null, 2)+'\n');
          "
          # Guarded like the sw.js rewrite below: not every app keeps a
          # manifest at the repo root (one of them ships its PWA manifest as
          # assets/favicon/site.webmanifest), and an unguarded readFileSync
          # here fails the whole deploy the moment that app opts into
          # version_bump. The point of this input is that a repo can adopt the
          # standard one piece at a time.
          if [ -f manifest.json ]; then
            node -e "
              const fs = require('fs');
              const m = JSON.parse(fs.readFileSync('manifest.json'));
              m.start_url = './index.html?v=$NEW';
              fs.writeFileSync('manifest.json', JSON.stringify(m, null, 2)+'\n');
            "
            git add manifest.json
          fi
          # Version badge, where an app renders one. Same reasoning.
          if [ -f index.html ]; then
            sed -i "s/v[0-9]\+\.[0-9]\+\.[0-9]\+/v$NEW/g" index.html
            git add index.html
          fi
          # Service-worker cache identity. An app whose sw.js declares the
          # canonical `const APP_VERSION = '…';` line gets it rewritten here, so
          # every deploy changes sw.js's bytes — which is the only thing that
          # triggers install → activate → drop the stale cache. Leaving this to
          # a hand-maintained constant shipped a fix to the origin that no
          # returning player ever executed (hecknsic#50/#52).
          # No-op for an app with no sw.js, or one that has not adopted the line.
          if [ -f sw.js ] && grep -q "^const APP_VERSION = '" sw.js; then
            sed -i "s/^const APP_VERSION = '[^']*';/const APP_VERSION = '$NEW';/" sw.js
            git add sw.js
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Only package.json is unconditional — every app has one. The blocks
          # above stage the files they actually rewrote, so naming manifest.json
          # or index.html here would fail the deploy for an app that has neither.
          git add package.json
          git diff --cached --quiet || git commit -m "chore: auto-bump to v$NEW [skip ci]"
          git push
          echo "Bumped $CURRENT → $NEW"

      - name: Stage deploy artifact (dist)
        # Mirrored by the "Render smoke (warn only)" step in the test job —
        # change one, change the other. That step exists to smoke the artifact
        # this one publishes, so the two must stage identically or it is
        # proving something about a different build.
        #
        # The artifact is ALWAYS dist/. An app with a build script produces
        # it; every other app ships tools/stage.mjs — the SAME module its
        # tests/deploy-artifact.test.js staged and asserted against in the
        # gate above. One implementation, so what CI publishes is exactly
        # what the suite proved correct; there is no second copy here to
        # drift out of sync with it.
        run: |
          if [ -f package.json ] && \
             [ "$(node -p 'Boolean(require("./package.json").scripts?.build)')" = "true" ]; then
            if [ -f package-lock.json ]; then npm ci; else npm install; fi
            npm run build
          elif [ -f tools/stage.mjs ]; then
            node tools/stage.mjs dist
          else
            echo "No build script and no tools/stage.mjs — the app must produce dist/ (GAME_INTEGRATION §13a)"
            exit 1
          fi
          [ -d dist ] || { echo "nothing produced dist/"; exit 1; }

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
